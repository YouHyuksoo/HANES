name: Deploy HANES MES to Windows Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    # self-hosted 러너는 job 이 끝나면 그 job 이 띄운 프로세스 트리를 정리한다.
    # PM2 데몬은 첫 pm2 호출 때 생성되므로, 그 시점부터 추적에서 빼지 않으면
    # job 종료와 함께 데몬이 죽는다. 데몬이 죽으면 백엔드가 같이 죽고
    # 프론트·프록시는 포트만 쥔 고아로 남아 TCP 는 붙는데 HTTP 응답이 없는 상태가 된다.
    # (2026-09-11~12 반복 장애의 원인. 배포 직후엔 정상, 몇 분 뒤 무응답.)
    # step 단위가 아니라 job 전체에 걸어야 첫 pm2 호출부터 보호된다.
    env:
      RUNNER_TRACKING_ID: ''

    defaults:
      run:
        working-directory: C:\Project\HANES

    steps:
      - name: Check current user
        run: |
          echo "=== Current User ==="
          whoami
        shell: cmd

      - name: Configure Git safe directory
        run: git config --global --add safe.directory C:/Project/HANES

      - name: Stop HANES processes only
        run: |
          set PM2_HOME=C:\Users\Administrator\.pm2
          pm2 stop hanes-frontend 2>nul || echo "hanes-frontend not running"
          pm2 stop hanes-backend 2>nul || echo "hanes-backend not running"
          pm2 delete hanes-frontend 2>nul || echo "hanes-frontend not registered"
          pm2 delete hanes-backend 2>nul || echo "hanes-backend not registered"
          pm2 stop hanes-proxy 2>nul || echo "hanes-proxy not running"
          pm2 delete hanes-proxy 2>nul || echo "hanes-proxy not registered"
        shell: cmd
        continue-on-error: true

      - name: Pull latest code
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: cmd

      - name: Build
        run: pnpm build
        shell: cmd

      # 환경 의존 테스트(시리얼포트, 백업 ZIP 등)가 러너에서 튀어도 배포(PM2 기동)를 막지 않는다.
      # 실패는 런 어노테이션으로 남으므로 방치하지 말고 확인할 것. 결정적 게이트는 typecheck가 담당.
      - name: Backend Jest
        run: pnpm run test:backend:ci
        shell: cmd
        continue-on-error: true

      - name: Backend typecheck
        run: pnpm run typecheck:backend
        shell: cmd

      - name: Frontend typecheck
        run: pnpm run typecheck:frontend
        shell: cmd

      - name: Generate runtime seed upload assets
        run: |
          node tools\generate-consumable-master-seed-images.mjs
          node tools\generate-equip-inspect-item-seed-images.mjs
          node tools\generate-work-instruction-seed-images.mjs
        shell: cmd

      # HTTPS 리버스 프록시(443 → 3002) 준비: caddy.exe 다운로드(없을 때만), 인증서 폴더, 방화벽 443, 포트 점유 확인.
      # tools/proxy/README.md 참조. 443 을 다른 프로그램이 쓰면 여기서 실패시켜 원인을 드러낸다.
      - name: Prepare HTTPS proxy (Caddy)
        run: |
          $ErrorActionPreference = 'Stop'
          $proxyDir = "C:\Project\HANES\tools\proxy"
          $exe = Join-Path $proxyDir "caddy.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Downloading caddy.exe ..."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri "https://caddyserver.com/api/download?os=windows&arch=amd64" -OutFile $exe -UseBasicParsing
          }
          & $exe version
          & $exe validate --config (Join-Path $proxyDir "Caddyfile") --adapter caddyfile
          $dataDir = "C:\ProgramData\HANES\caddy"
          if (!(Test-Path $dataDir)) { New-Item -ItemType Directory -Path $dataDir -Force | Out-Null }
          if (-not (Get-NetFirewallRule -DisplayName "HANES HTTPS 443" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -DisplayName "HANES HTTPS 443" -Direction Inbound -Protocol TCP -LocalPort 443 -Action Allow -Profile Any | Out-Null
            Write-Host "Firewall rule added: HANES HTTPS 443"
          }
        shell: powershell

      # pm2 delete 는 등록만 지운다. 남은 자식 프로세스 트리가 3002/3003/443 을 계속 물고 있으면
      # 새 프로세스가 EADDRINUSE 로 죽고 좀비가 포트를 서비스한다(TCP 는 붙는데 HTTP 무응답).
      # 여기서 포트를 확실히 비운 뒤에 기동한다. 다른 프로그램이 쓰는 포트면 스크립트가 실패시킨다.
      - name: Free HANES ports (3002/3003/443)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File C:\Project\HANES\scripts\free-hanes-ports.ps1
        shell: cmd

      - name: Start HANES PM2 processes
        run: |
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          if (!(Test-Path "C:\Project\HANES\logs")) { New-Item -ItemType Directory -Path "C:\Project\HANES\logs" | Out-Null }
          $ErrorActionPreference = 'SilentlyContinue'
          pm2 delete hanes-frontend 2>&1 | Out-Null
          pm2 delete hanes-backend 2>&1 | Out-Null
          pm2 delete hanes-proxy 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          Set-Location C:\Project\HANES
          # RUNNER_TRACKING_ID 는 job 레벨 env 에서 이미 비워 둔다(파일 상단 주석 참조).
          pm2 start ecosystem.config.js --update-env
          pm2 save
          Start-Sleep 8
          pm2 list
        shell: powershell

      # PM2 로그가 무한정 커지는 것을 막는다. 로테이션이 없어 backend-error.log 가 100MB,
      # backend-out.log 가 73MB 까지 자라 있었다(2026-09-12 확인). 프록시는 Caddyfile 에
      # roll_size/roll_keep 이 있어 4MB 대로 유지되고 있었고, PM2 쪽만 빠져 있었다.
      # pm2-logrotate 는 PM2 모듈이라 데몬이 떠 있는 상태에서 설치·설정한다.
      - name: Configure PM2 log rotation
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          if (!(Test-Path (Join-Path $env:PM2_HOME "node_modules\pm2-logrotate"))) {
            Write-Host "installing pm2-logrotate ..."
            pm2 install pm2-logrotate
          } else {
            Write-Host "pm2-logrotate already installed"
          }
          # 설정은 매 배포마다 다시 맞춘다. 서버에서 손으로 바꿔도 배포가 기준값으로 되돌린다.
          pm2 set pm2-logrotate:max_size 20M          # 20MB 넘으면 새 파일로 교체
          pm2 set pm2-logrotate:retain 10             # 최근 10개만 보관(압축 기준 상한 수백 MB)
          pm2 set pm2-logrotate:compress true         # 회전된 파일은 gzip 압축
          pm2 set pm2-logrotate:rotateInterval '0 0 * * *'  # 크기와 별개로 매일 자정에도 교체
          pm2 set pm2-logrotate:workerInterval 60     # 60초마다 크기 확인
          Write-Host "--- pm2-logrotate config ---"
          pm2 conf pm2-logrotate
        shell: powershell

      # 기동 확인. 예전에는 443 리스너만 경고로 보고 넘어가서, 프론트·프록시가 재시작만 반복하며
      # 죽어 있어도 배포가 초록불로 끝났다(2026-09-11). 이제 실패시켜 즉시 드러낸다.
      - name: Verify HANES services are serving
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          # 러너 콘솔이 UTF-8 이 아니라 한글이 깨져 원인을 못 읽는다. 이 단계의 출력은 영문으로 쓴다.
          $problems = @()

          # 1) 실제로 응답할 때까지 기다린다. Next 프로덕션 기동과 Nest 부팅은 수십 초 걸릴 수 있어
          #    한 번만 찔러보면 아직 부팅 중인 서버를 죽었다고 오판한다(2026-09-12 실패 사례).
          function Wait-Service {
            param([string]$Name, [string]$Url, [int]$TimeoutSec = 180)
            $deadline = (Get-Date).AddSeconds($TimeoutSec)
            $lastError = 'no attempt'
            while ((Get-Date) -lt $deadline) {
              try {
                $res = Invoke-WebRequest -Uri $Url -UseBasicParsing -TimeoutSec 10
                Write-Host "$Name responded $($res.StatusCode)"
                return $null
              } catch {
                # 404/401 등은 HTTP 응답이 온 것이므로 살아 있다고 본다. 무응답·연결거부만 재시도.
                $code = $_.Exception.Response.StatusCode.value__
                if ($code) { Write-Host "$Name responded $code"; return $null }
                $lastError = $_.Exception.Message
              }
              Start-Sleep -Seconds 5
            }
            return "$Name did not respond within $TimeoutSec s: $lastError"
          }

          foreach ($probe in @(@{ Name = 'frontend'; Url = 'http://127.0.0.1:3002/' }, @{ Name = 'backend'; Url = 'http://127.0.0.1:3003/api' })) {
            $failure = Wait-Service -Name $probe.Name -Url $probe.Url
            if ($failure) { $problems += $failure }
          }

          # 2) 응답이 온 뒤 PM2 상태를 본다. 재시작 루프(포트 충돌·크래시)를 여기서 잡는다.
          #    jlist 를 못 읽으면 이 검사만 건너뛴다. 실제 게이트는 위 응답 확인이다.
          $list = $null
          try { $list = pm2 jlist | ConvertFrom-Json } catch { Write-Warning "pm2 jlist parse failed: $($_.Exception.Message)" }
          if ($list) {
            foreach ($name in @('hanes-frontend', 'hanes-backend', 'hanes-proxy')) {
              $app = $list | Where-Object { $_.name -eq $name }
              if (-not $app) { $problems += "$name is not registered in PM2"; continue }
              $status = if ($app.pm2_env -and $app.pm2_env.status) { $app.pm2_env.status } else { $app.status }
              $restarts = if ($app.pm2_env -and $null -ne $app.pm2_env.restart_time) { [int]$app.pm2_env.restart_time } else { -1 }
              Write-Host "$name : status=$status restarts=$restarts"
              if ($status -and $status -ne 'online') { $problems += "$name status is $status" }
              elseif ($restarts -ge 3) { $problems += "$name restarted $restarts times (port conflict or crash loop)" }
            }
          }

          if ($problems.Count -gt 0) {
            pm2 logs hanes-frontend --lines 40 --nostream
            pm2 logs hanes-proxy --lines 40 --nostream
            throw ("HANES services did not come up:`n  - " + ($problems -join "`n  - "))
          }
          Write-Host "All HANES services are serving."
        shell: powershell
